# Analyzer and lint configuration.
# Run `flutter analyze` to check the project. The goal is always 0 issues.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    # No implicit casts from dynamic, e.g. `String s = json['name'];` must be explicit.
    strict-casts: true
    # Report places where a type can't be inferred and silently becomes dynamic.
    strict-inference: true
    # Generic types must have their type arguments, e.g. `List<int>`, not `List`.
    strict-raw-types: true

linter:
  rules:
    # Imports always start with `package:garipath/...`, never relative paths.
    - always_use_package_imports
    # Use debugPrint or a logger instead of print.
    - avoid_print
    # Every StreamSubscription must be cancelled and every sink closed (resource safety).
    - cancel_subscriptions
    - close_sinks
    # A Future that is not awaited must be wrapped in `unawaited(...)` on purpose.
    - unawaited_futures
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - avoid_dynamic_calls
